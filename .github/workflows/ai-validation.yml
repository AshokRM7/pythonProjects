name: AI Validation

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests (mock mode)
        env:
          OPENAI_API_KEY: mock
        run: pytest tests/test_framework.py -v

      - name: Run quality gate (mock mode)
        env:
          OPENAI_API_KEY: mock
        run: python scripts/run_quality_gate.py
